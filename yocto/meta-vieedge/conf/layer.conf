BBPATH .= ":${LAYERDIR}"

BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "vieedge"
BBFILE_PATTERN_vieedge = "^${LAYERDIR}/"
BBFILE_PRIORITY_vieedge = "10"

LAYERDEPENDS_vieedge = "core openembedded-layer meta-python raspberrypi"
LAYERSERIES_COMPAT_vieedge = "scarthgap"

# Root of the vieedge-voice repository (the layer lives in <repo>/yocto/meta-vieedge)
VIEEDGE_REPO := "${@os.path.abspath(os.path.join(d.getVar('LAYERDIR'), '..', '..'))}"
