[project]
name = "vieedge"
version = "0.1.0"
description = "VieEdge-Voice: offline Vietnamese voice Q&A on Raspberry Pi 5 + Hailo-8L"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy", "pyyaml", "psutil", "fastapi", "uvicorn", "websockets", "ctranslate2", "onnxruntime"]

[project.optional-dependencies]
pi = ["pyalsaaudio", "gpiod"]
laptop = ["sounddevice", "soundfile"]
dev = ["pytest", "ruff", "jiwer", "matplotlib", "pandas"]

[project.scripts]
vieedge = "vieedge.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vieedge = ["stt/assets/*.npz", "web/static/*"]

[tool.ruff]
line-length = 130
target-version = "py311"
src = ["src", "bench", "training", "tests", "hailo_compile", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501", "B008", "E741", "B905", "B007"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]

[tool.ruff.lint.per-file-ignores]
"src/vieedge/fastpath/combo.py" = ["UP031"]
"src/vieedge/fastpath/reflex.py" = ["UP031"]
